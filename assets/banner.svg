<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#16130a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>

  <!-- Left: text -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="96" width="112" height="32" rx="16" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="136" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#fbbf24">PUBLIC BETA</text>
    <text x="80" y="226" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">Leetvision</text>
    <text x="80" y="284" font-size="32" font-weight="600" fill="#fbbf24">Never forget how you solved it.</text>
    <text x="80" y="340" font-size="20" fill="#a1a1aa">A LeetCode revision system that analyzes every</text>
    <text x="80" y="370" font-size="20" fill="#a1a1aa">submission and brings it back when you need it.</text>
    <g font-size="15" font-weight="600" fill="#d4d4d8">
      <rect x="80" y="418" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="155" y="442" text-anchor="middle">Manifest V3</text>
      <rect x="244" y="418" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="319" y="442" text-anchor="middle">Zero dependencies</text>
      <rect x="408" y="418" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="483" y="442" text-anchor="middle">Chrome</text>
    </g>
  </g>

  <!-- Right: browser mock with analysis panel -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="720" y="90" width="480" height="380" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="720" y="90" width="480" height="44" rx="18" fill="#17171c"/>
    <rect x="720" y="116" width="480" height="18" fill="#17171c"/>
    <circle cx="746" cy="112" r="6" fill="#ef4444"/>
    <circle cx="768" cy="112" r="6" fill="#fbbf24"/>
    <circle cx="790" cy="112" r="6" fill="#22c55e"/>
    <rect x="820" y="101" width="340" height="22" rx="11" fill="#ffffff" fill-opacity="0.07"/>
    <text x="838" y="117" font-size="12" fill="#a1a1aa">leetcode.com/problems/two-sum</text>

    <text x="750" y="178" font-size="20" font-weight="700" fill="#ffffff">Analysis</text>
    <rect x="1086" y="160" width="84" height="26" rx="13" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="1128" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#4ade80">Accepted</text>

    <g font-size="14">
      <text x="750" y="222" fill="#a1a1aa">Approach</text>
      <text x="1170" y="222" text-anchor="end" fill="#ffffff" font-weight="600">Hash Map</text>
      <line x1="750" y1="238" x2="1170" y2="238" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="750" y="266" fill="#a1a1aa">Time</text>
      <text x="1170" y="266" text-anchor="end" fill="#fbbf24" font-weight="600">O(n)</text>
      <line x1="750" y1="282" x2="1170" y2="282" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="750" y="310" fill="#a1a1aa">Space</text>
      <text x="1170" y="310" text-anchor="end" fill="#fbbf24" font-weight="600">O(n)</text>
    </g>

    <text x="750" y="352" font-size="14" fill="#a1a1aa">Suggested improvement</text>
    <rect x="750" y="366" width="420" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="750" y="386" width="330" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="750" y="406" width="380" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="750" y="432" width="140" height="22" rx="11" fill="#fbbf24" fill-opacity="0.15"/>
    <text x="820" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">Saved to dashboard</text>
  </g>
</svg>
